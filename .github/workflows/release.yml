name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: $/.github/workflows/ci.yaml

  semver:
    name: Semver
    uses: $/.github/workflows/semver.yml

  docs:
    name: Docs
    uses: $/.github/workflows/docs.yml

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: release
    needs: [ci, semver, docs]
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Fetch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install rust stable
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: stable
          cache: false

      - name: Check tag matches crate version
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match crate version $crate_version, refusing to publish"
            exit 1
          fi

      - name: Get crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
